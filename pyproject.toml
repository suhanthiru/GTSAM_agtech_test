[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agspray"
version = "0.1.0"
description = "Chemical waste under degraded state estimation in agricultural spraying"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyarrow",
    "joblib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
graph = ["gtsam==4.3a2"]
dev = ["pytest"]
# LiDAR demo: ray casting and scan registration.  Both wheels exist for Linux
# and for Windows, so the simulator and the map run on either side; only the
# factor graph is tied to WSL, because gtsam has no Windows wheel.
lidar = ["open3d>=0.19", "small_gicp"]
# LiDAR demo: offscreen rendering and video encoding (Windows host)
render = ["pyvista", "imageio", "imageio-ffmpeg", "pillow"]

[tool.setuptools.packages.find]
include = ["agspray*", "lidar_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
